<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>मेरा हिसाब</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: one narrow ledger page. Summary card with a double-rule total, a bahi-khata
   style table with separate जमा and खर्च columns, a fixed add bar at the bottom, and an
   add sheet that slides up. Ink-blue is the only accent; green and red are for money only. */
:root {
  --bg: #F1F5F0;
  --surface: #FAFCF9;
  --fg: #18241F;
  --muted: #5A6A61;
  --rule: #CBD8CE;
  --rule-strong: #9DB1A4;
  --ink: #1D4B5C;
  --in: #1B7347;
  --out: #B1352C;
  --in-tint: #E1F0E6;
  --out-tint: #F7E4E1;
  --in-solid: #1B7347;
  --out-solid: #B1352C;
  --on-solid: #FFFFFF;
  --scrim: rgba(12, 22, 17, 0.45);
  --font-body: 'Hind', 'Noto Sans Devanagari', system-ui, sans-serif;
  --font-display: 'Tiro Devanagari Hindi', 'Noto Serif Devanagari', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512;
    --surface: #151E1A;
    --fg: #E4EDE7;
    --muted: #94A79C;
    --rule: #2B3A32;
    --rule-strong: #44584D;
    --ink: #7FBFD3;
    --in: #5CC48B;
    --out: #F0877D;
    --in-tint: #15291D;
    --out-tint: #301A18;
    --in-solid: #3DAA75;
    --out-solid: #E2625A;
    --on-solid: #08120D;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512;
  --surface: #151E1A;
  --fg: #E4EDE7;
  --muted: #94A79C;
  --rule: #2B3A32;
  --rule-strong: #44584D;
  --ink: #7FBFD3;
  --in: #5CC48B;
  --out: #F0877D;
  --in-tint: #15291D;
  --out-tint: #301A18;
  --in-solid: #3DAA75;
  --out-solid: #E2625A;
  --on-solid: #08120D;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.55 var(--font-body);
  padding-top: 20px;
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
html.lock { overflow: hidden; }
.wrap { max-width: 560px; margin: 0 auto; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button { font-family: inherit; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { margin: 0; font: 400 28px/1.3 var(--font-display); text-wrap: balance; }
.months { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; }
.months button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: var(--ink); font-size: 24px; line-height: 1; cursor: pointer; }
.months button:disabled { color: var(--rule-strong); cursor: default; }
#monthLabel { min-width: 104px; text-align: center; font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 18px 16px; }
.label { margin: 0; color: var(--muted); font-size: 14px; }
.big { margin: 4px 0 16px; display: inline-block; max-width: 100%; overflow-wrap: anywhere; font: 400 clamp(32px, 10vw, 44px)/1.25 var(--font-display); font-variant-numeric: tabular-nums; border-bottom: 4px double var(--rule-strong); }
.big.pos { color: var(--in); }
.big.neg { color: var(--out); }
.big.zero { color: var(--fg); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair > div { min-width: 0; }
.pair > div + div { border-left: 1px solid var(--rule); padding-left: 12px; }
.pair .k { display: block; font-size: 14px; color: var(--muted); }
.pair .v { display: block; font: 400 22px/1.4 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pair .in .v { color: var(--in); }
.pair .out .v { color: var(--out); }

.sec { margin: 28px 0 10px; font: 400 21px/1.35 var(--font-display); }

.cats { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 6px 16px; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.cat:last-child { border-bottom: 0; }
.cat .nm { min-width: 0; overflow-wrap: anywhere; }
.cat .am { font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--out-tint); overflow: hidden; }
.fill { height: 100%; border-radius: 4px; background: var(--out-solid); }

.ledger { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
table { width: 100%; min-width: 300px; border-collapse: collapse; }
th { padding: 10px; text-align: right; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid var(--rule-strong); white-space: nowrap; }
th:first-child { text-align: left; padding-left: 12px; }
th.in { color: var(--in); }
th.out { color: var(--out); }
td { padding: 0; vertical-align: top; border-bottom: 1px solid var(--rule); }
td.amt { padding: 10px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; border-left: 1px solid var(--rule); }
td.amt.in { color: var(--in); }
td.amt.out { color: var(--out); }
.dategroup td { padding: 6px 12px; background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 500; }
.rowbtn { display: block; width: 100%; min-height: 44px; padding: 10px 12px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.rowbtn .c { display: block; font-weight: 500; overflow-wrap: anywhere; }
.rowbtn .n { display: block; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.detail td { padding: 8px 12px 12px; background: var(--bg); }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ask { font-weight: 500; }
.btn-s { min-height: 40px; padding: 0 14px; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--surface); color: var(--fg); font-size: 15px; cursor: pointer; }
.btn-danger { color: var(--out); border-color: var(--out); }
.btn-danger.solid { background: var(--out-solid); border-color: var(--out-solid); color: var(--on-solid); }
tfoot td { padding: 10px; border-top: 3px double var(--rule-strong); border-bottom: 0; font-weight: 600; }
tfoot td:first-child { padding-left: 12px; }
tfoot td.amt { border-left: 1px solid var(--rule); }

.empty { padding: 20px; border: 1.5px dashed var(--rule-strong); border-radius: 14px; color: var(--muted); }
.empty strong { display: block; margin-bottom: 6px; color: var(--fg); font: 400 19px/1.45 var(--font-display); }
.empty p { margin: 0; }
.empty ul { margin: 8px 0 0; padding-left: 20px; }

.foot { margin: 18px 0 0; font-size: 13px; color: var(--muted); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--rule); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.add { min-height: 52px; border: 0; border-radius: 12px; color: var(--on-solid); font: 600 17px/1.2 var(--font-body); cursor: pointer; }
.add.in { background: var(--in-solid); }
.add.out { background: var(--out-solid); }
.add:disabled { opacity: 0.5; cursor: default; }

.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.sheet { --tone: var(--out-solid); position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--surface); color: var(--fg); border-radius: 18px 18px 0 0; padding-top: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet[data-type="in"] { --tone: var(--in-solid); }
.sheet-title { margin: 0 0 12px; font: 400 22px/1.35 var(--font-display); }
.seg { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 14px; border: 1px solid var(--rule-strong); border-radius: 12px; overflow: hidden; }
.seg button { min-height: 44px; border: 0; background: var(--surface); color: var(--fg); font: 500 16px/1.2 var(--font-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--tone); color: var(--on-solid); }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; margin-bottom: 4px; font-size: 14px; color: var(--muted); }
.field input { display: block; width: 100%; min-height: 48px; padding: 8px 12px; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit; }
#amount { font: 400 28px/1.4 var(--font-display); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--surface); color: var(--fg); font-size: 15px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--tone); border-color: var(--tone); color: var(--on-solid); }
.quick { margin-bottom: 14px; padding: 12px; border: 1px dashed var(--rule-strong); border-radius: 12px; background: var(--bg); }
.quick .field { margin-bottom: 0; }
.field textarea { display: block; width: 100%; min-height: 64px; padding: 8px 12px; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--surface); color: var(--fg); font: inherit; resize: vertical; }
.quick-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; }
.hint { margin: 0; min-width: 0; flex: 1 1 180px; font-size: 13px; color: var(--muted); }
#quickMsg { margin-top: 8px; color: var(--fg); }
.err { margin: 0 0 10px; color: var(--out); font-size: 14px; }
.acts2 { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.cancel, .save { min-height: 52px; border-radius: 12px; font: 600 17px/1.2 var(--font-body); cursor: pointer; }
.cancel { border: 1px solid var(--rule-strong); background: var(--surface); color: var(--fg); }
.save { border: 0; background: var(--tone); color: var(--on-solid); }
.save:disabled { opacity: 0.6; }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: calc(100% - 32px); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 15px; text-align: center; }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.22s ease-out; }
  @keyframes rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <h1>मेरा हिसाब</h1>
    <nav class="months" aria-label="महीना बदलें">
      <button type="button" id="prev" aria-label="पिछला महीना">‹</button>
      <div id="monthLabel" aria-live="polite"></div>
      <button type="button" id="next" aria-label="अगला महीना">›</button>
    </nav>
  </header>

  <section id="summary" aria-label="महीने का सार"></section>
  <section id="breakdown"></section>
  <section>
    <h2 class="sec">हिसाब की बही</h2>
    <div id="ledger"></div>
  </section>
  <p id="foot" class="foot"></p>
</div>

<div class="bar">
  <div class="wrap">
    <button type="button" id="addIn" class="add in" disabled>+ आमदनी</button>
    <button type="button" id="addOut" class="add out" disabled>− खर्च</button>
  </div>
</div>

<div id="scrim" class="scrim" hidden></div>

<form id="sheet" class="sheet" data-type="out" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate hidden>
  <div class="wrap">
    <h2 id="sheetTitle" class="sheet-title">खर्च जोड़ें</h2>
    <div class="quick">
      <label class="field" for="quick">
        <span>बोलकर या मैसेज से भरें</span>
        <textarea id="quick" rows="2" maxlength="600" autocomplete="off" spellcheck="false" placeholder="जैसे: दूध 60 रुपये खर्च"></textarea>
      </label>
      <div class="quick-row">
        <button type="button" id="quickFill" class="btn-s">भर दें</button>
        <p class="hint">कीबोर्ड पर माइक का निशान दबाकर बोलिए, या बैंक/UPI का मैसेज यहाँ पेस्ट कीजिए।</p>
      </div>
      <p id="quickMsg" class="hint" role="status" hidden></p>
    </div>
    <div class="seg" role="group" aria-label="आमदनी या खर्च">
      <button type="button" id="segIn" aria-pressed="false">आमदनी</button>
      <button type="button" id="segOut" aria-pressed="true">खर्च</button>
    </div>
    <label class="field" for="amount">
      <span>रकम (₹)</span>
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
    </label>
    <div class="field">
      <span id="catLabel">किस चीज़ का? (चुनना ज़रूरी नहीं)</span>
      <div id="chips" class="chips" role="group" aria-labelledby="catLabel"></div>
    </div>
    <label class="field" for="note">
      <span>विवरण (वैकल्पिक)</span>
      <input id="note" type="text" maxlength="80" autocomplete="off">
    </label>
    <label class="field" for="date">
      <span>तारीख़</span>
      <input id="date" type="date">
    </label>
    <p id="err" class="err" role="alert" hidden></p>
    <div class="acts2">
      <button type="button" id="cancel" class="cancel">रद्द करें</button>
      <button type="submit" id="save" class="save">सेव करें</button>
    </div>
  </div>
</form>

<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var MONTHS = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];
  var DAYS = ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'];
  var CATS = {
    out: ['खाना-पीना', 'सब्ज़ी-राशन', 'किराया', 'बिजली-पानी', 'मोबाइल रिचार्ज', 'यात्रा-पेट्रोल', 'दवाई-इलाज', 'पढ़ाई', 'कपड़े', 'अन्य'],
    'in': ['वेतन', 'दुकान-कारोबार', 'मज़दूरी', 'खेती', 'उधार वापसी', 'तोहफ़ा', 'अन्य']
  };
  var STORE_KEY = 'mera-hisab-v1';

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function ymOf(s) { return s.slice(0, 7); }
  function monthName(ym) { var p = ym.split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
  function shift(ym, delta) {
    var p = ym.split('-');
    var d = new Date(+p[0], +p[1] - 1 + delta, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function dateLabel(s) {
    var p = s.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var t = (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ', ' + DAYS[d.getDay()];
    return s === today() ? t + ' · आज' : t;
  }
  // c is an integer number of paise
  function fmt(c) {
    var a = Math.abs(c);
    var n = a / 100;
    var frac = a % 100 !== 0;
    try {
      return n.toLocaleString('en-IN', { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2 });
    } catch (e) {
      return n.toFixed(frac ? 2 : 0);
    }
  }
  function cents(e) { return Math.round(e.amount * 100); }

  function clean(o) {
    if (!o || (o.type !== 'in' && o.type !== 'out')) return null;
    var a = Number(o.amount);
    if (!isFinite(a) || a <= 0) return null;
    if (typeof o.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(o.date)) return null;
    return {
      id: String(o.id),
      type: o.type,
      amount: a,
      cat: typeof o.cat === 'string' && o.cat ? o.cat : 'अन्य',
      note: typeof o.note === 'string' ? o.note : '',
      date: o.date,
      ts: Number(o.ts) || 0
    };
  }
  function sorted(list) {
    return list.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.ts - a.ts;
    });
  }
  function sums(list) {
    var i = 0, o = 0;
    list.forEach(function (e) { if (e.type === 'in') i += cents(e); else o += cents(e); });
    return { 'in': i, out: o, bal: i - o };
  }

  var state = {
    entries: [],
    mode: 'loading',
    month: ymOf(today()),
    openId: null,
    confirmId: null,
    focusKey: null,
    type: 'out',
    cat: '',
    localOk: true
  };
  var backend = null;
  var lastOpener = null;
  var toastTimer = null;

  /* ---------- drawing ---------- */

  function renderTop() {
    $('monthLabel').textContent = monthName(state.month);
    $('next').disabled = state.month >= ymOf(today());
  }

  function stat(label, c, kind) {
    var d = el('div', kind);
    d.appendChild(el('span', 'k', label));
    d.appendChild(el('span', 'v', '₹' + fmt(c)));
    return d;
  }

  function renderSummary(list) {
    var s = sums(list);
    var box = $('summary');
    box.textContent = '';
    var neg = s.bal < 0;
    var card = el('div', 'card');
    card.appendChild(el('p', 'label', neg ? 'कमी (खर्च, जमा से ज़्यादा)' : 'बचत (जमा − खर्च)'));
    var tone = s.bal === 0 ? 'zero' : (neg ? 'neg' : 'pos');
    card.appendChild(el('p', 'big ' + tone, (neg ? '−' : '') + '₹' + fmt(s.bal)));
    var pair = el('div', 'pair');
    pair.appendChild(stat('जमा', s['in'], 'in'));
    pair.appendChild(stat('खर्च', s.out, 'out'));
    card.appendChild(pair);
    box.appendChild(card);
  }

  function renderBreakdown(list) {
    var box = $('breakdown');
    box.textContent = '';
    var by = {};
    list.forEach(function (e) {
      if (e.type === 'out') by[e.cat] = (by[e.cat] || 0) + cents(e);
    });
    var rows = Object.keys(by).map(function (k) { return { k: k, v: by[k] }; })
      .sort(function (a, b) { return b.v - a.v; });
    if (!rows.length) return;
    box.appendChild(el('h2', 'sec', 'खर्च कहाँ हुआ'));
    var wrap = el('div', 'cats');
    rows.forEach(function (r) {
      var row = el('div', 'cat');
      row.appendChild(el('span', 'nm', r.k));
      row.appendChild(el('span', 'am', '₹' + fmt(r.v)));
      var track = el('div', 'track');
      var fill = el('div', 'fill');
      fill.style.width = Math.max(4, Math.round(r.v / rows[0].v * 100)) + '%';
      track.appendChild(fill);
      row.appendChild(track);
      wrap.appendChild(row);
    });
    box.appendChild(wrap);
  }

  function emptyCard() {
    var d = el('div', 'empty');
    if (state.mode === 'loading') {
      d.appendChild(el('strong', null, 'हिसाब खुल रहा है…'));
      d.appendChild(el('p', null, 'कुछ सेकंड रुकिए।'));
      return d;
    }
    d.appendChild(el('strong', null, 'इस महीने अभी कोई हिसाब नहीं'));
    d.appendChild(el('p', null, 'नीचे के बटन से आमदनी और खर्च लिखिए। जैसे:'));

      }).join(' ');
    }
    return { type: type, amount: amount, cat: cat, note: note.slice(0, 80), date: dateFrom(raw, t) || today() };
  }

  function markChips() {
    Array.prototype.forEach.call($('chips').children, function (c) {
      c.setAttribute('aria-pressed', state.cat && c.textContent === state.cat ? 'true' : 'false');
    });
  }

  function applyQuick() {
    var raw = $('quick').value.trim();
    var msg = $('quickMsg');
    msg.hidden = false;
    if (!raw) {
      msg.textContent = 'पहले बोलकर लिखिए या मैसेज पेस्ट कीजिए।';
      return;
    }
    var r = parseQuick(raw);
    if (!r) {
      msg.textContent = 'रकम समझ नहीं आई। रकम अंकों में लिखिए, जैसे: दूध 60 रुपये खर्च';
      return;
    }
    setType(r.type);
    state.cat = r.cat;
    markChips();
    $('amount').value = String(r.amount);
    $('note').value = r.note;
    $('date').value = r.date;
    $('err').hidden = true;
    msg.textContent = 'भर दिया: ' + (r.type === 'in' ? 'आमदनी' : 'खर्च') + ' ₹' + fmt(Math.round(r.amount * 100)) +
      (r.cat ? ', ' + r.cat : '') + '। नीचे जाँचिए, गलत हो तो ठीक कीजिए, फिर सेव करें दबाइए।';
  }

  async function submitSheet(ev) {
    ev.preventDefault();
    var amt = parseAmount($('amount').value);
    if (!isFinite(amt) || amt <= 0) {
      showErr('रकम लिखिए, जो 0 से ज़्यादा हो। जैसे: 250');
      $('amount').focus();
      return;
    }
    if (amt > 999999999) {
      showErr('रकम बहुत बड़ी है। कृपया जाँच लें।');
      return;
    }
    amt = Math.round(amt * 100) / 100;
    var d = $('date').value || today();
    var entry = {
      type: state.type,
      amount: amt,
      cat: state.cat || 'अन्य',
      note: $('note').value.trim().slice(0, 80),
      date: d,
      ts: Date.now()
    };
    var btn = $('save');
    btn.disabled = true;
    try {
      await backend.add(entry);
      state.month = ymOf(d);
      state.openId = null;
      state.confirmId = null;
      closeSheet();
      render();
      showToast('सेव हो गया');
    } catch (e) {
      showErr(e && e.code === 'quota_exceeded'
        ? 'जगह भर गई है। कुछ पुराने हिसाब हटाइए।'
        : 'सेव नहीं हो पाया। दोबारा कोशिश कीजिए।');
    } finally {
      btn.disabled = false;
    }
  }

  async function doDelete(id) {
    try {
      await backend.remove(id);
      state.openId = null;
      state.confirmId = null;
      showToast('हटा दिया');
    } catch (e) {
      showToast('हट नहीं पाया। दोबारा कोशिश कीजिए।');
    }
    render();
  }

  /* ---------- storage ---------- */

  function loadLocal() {
    try {
      var arr = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return arr.map(clean).filter(Boolean);
    } catch (e) {
      return [];
    }
  }
  function saveLocal() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state.entries));
      state.localOk = true;
    } catch (e) {
      state.localOk = false;
    }
  }

  function startLocal() {
    state.entries = loadLocal();
    state.mode = 'local';
    backend = {
      add: function (e) {
        e.id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        state.entries.push(e);
        saveLocal();
        return Promise.resolve();
      },
      remove: function (id) {
        state.entries = state.entries.filter(function (x) { return x.id !== id; });
        saveLocal();
        return Promise.resolve();
      }
    };
    render();
  }

  function startDb(db, uid) {
    var col = db.collection('data/users/' + uid);
    backend = {
      add: function (e) { return col.doc().set(e); },
      remove: function (id) { return col.doc(id).delete(); }
    };
    col.orderBy('date', 'desc').limit(1000).onSnapshot(function (snap) {
      state.entries = snap.docs.map(function (d) {
        // d.data() is frozen, so copy it into a new object before adding the id
        return clean(Object.assign({}, d.data() || {}, { id: d.id }));
      }).filter(Boolean);
      state.mode = 'db';
      render();
    }, function () {
      state.mode = 'error';
      render();
    });
  }

  async function init() {
    render();
    var c = window.claude;
    if (c && typeof c.use === 'function') {
      try {
        var res = await Promise.all([c.use('db'), c.use('user')]);
        var db = res[0];
        var user = res[1];
        var uid = user ? await user.id() : null;
        if (db && uid) {
          startDb(db, uid);
          return;
        }
      } catch (e) { /* fall through to local mode */ }
    }
    startLocal();
  }

  /* ---------- wiring ---------- */

  $('prev').addEventListener('click', function () {
    state.month = shift(state.month, -1);
    state.openId = null;
    state.confirmId = null;
    render();
  });
  $('next').addEventListener('click', function () {
    if (state.month >= ymOf(today())) return;
    state.month = shift(state.month, 1);
    state.openId = null;
    state.confirmId = null;
    render();
  });
  $('addIn').addEventListener('click', function () { openSheet('in', this); });
  $('addOut').addEventListener('click', function () { openSheet('out', this); });
  $('segIn').addEventListener('click', function () { setType('in'); });
  $('segOut').addEventListener('click', function () { setType('out'); });
  $('cancel').addEventListener('click', closeSheet);
  $('quickFill').addEventListener('click', applyQuick);
  $('quick').addEventListener('paste', function () { setTimeout(applyQuick, 0); });
  $('scrim').addEventListener('click', closeSheet);
  $('sheet').addEventListener('submit', submitSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('sheet').hidden) closeSheet();
  });

  init();
})();
</script>

</body></html>
